name: 社群發文（IG、Threads）

on:
  schedule:
    - cron: "*/15 * * * *"        # 每 15 分鐘檢查一次（UTC）；GitHub 尖峰時可能延遲
  workflow_dispatch:
    inputs:
      args:
        description: "social_post.py 參數（預設 due；測試用例：test e01_p1 ig）"
        required: false
        default: "due"

permissions:
  contents: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 發文
        env:
          META_PAGE_ID: "1342938745576793"
          META_IG_ID: "17841415159731706"
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TZ: Asia/Taipei
        run: python social_post.py ${{ github.event.inputs.args || 'due' }}
      - name: 提交發布紀錄
        if: always()
        run: |
          git config user.name "hupotalks-bot"
          git config user.email "hupotalks-bot@users.noreply.github.com"
          git add social_post_state.json social_post_log.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then echo "沒有新紀錄"; else git commit -m "發布紀錄 $(date '+%m/%d %H:%M')" && git pull --rebase -q && git push; fi
